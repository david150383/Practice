apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-app-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-app
  template:
    metadata:
      labels:
        app: mongo-app
    spec:
      containers:
        - name: mongo-app
          image: mongo:8
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-srv
spec:
  selector:
    app: mongo-app
  ports:
    - name: db
      protocol: TCP
      port: 27017
      targetPort: 27017
