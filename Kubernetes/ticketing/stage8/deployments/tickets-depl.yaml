apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickets-depl
  namespace: tickets-app
spec:
  # Omit replicas if HPA manages scaling.
  selector:
    matchLabels:
      app: tickets
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  minReadySeconds: 10
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5

  template:
    metadata:
      labels:
        app: tickets
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

        seccompProfile:
          type: RuntimeDefault
      
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi

      terminationGracePeriodSeconds: 45
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: tickets
              
      containers:
        - name: tickets
          image: ticketing-nats-tickets-app:1.2

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /api/tickets/health/live
              port: 3001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /api/tickets/health/live
              port: 3001
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/tickets/health/ready
              port: 3001
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 2
          envFrom:
            - configMapRef:
                name: nats-configuration
            - secretRef:
                name: my-app-secret
          env:
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: app-configuration
                  key: MONGO_URI_TICKETS
---
apiVersion: v1
kind: Service
metadata:
  name: tickets-srv
  namespace: tickets-app
spec:
  selector:
    app: tickets
  ports:
    - name: tickets
      protocol: TCP
      port: 3000
      targetPort: 3001
